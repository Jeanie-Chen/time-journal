<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時間反思筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-question-at-a-time journal card on a warm cocoa ground; summary page doubles as the printable record */
:root {
  --bg: #F7EEE4;
  --surface: #FFFFFF;
  --ink: #3B2A22;
  --ink-soft: #7A6457;
  --dusk: #5A3E31;
  --amber: #C47A2E;
  --amber-soft: #F6DFC4;
  --sage: #5F7F4F;
  --line: #E8D9C8;
  --font-display: "PingFang TC", "Noto Sans TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-body: "PingFang TC", "Noto Sans TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1612; --surface: #2B201B; --ink: #F3E9DF; --ink-soft: #C4AF9F;
    --dusk: #150F0C; --amber: #E9A35A; --amber-soft: #4A3524; --sage: #9DBA8A; --line: #45352B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1612; --surface: #2B201B; --ink: #F3E9DF; --ink-soft: #C4AF9F;
  --dusk: #150F0C; --amber: #E9A35A; --amber-soft: #4A3524; --sage: #9DBA8A; --line: #45352B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding: 0 16px; padding-block: env(safe-area-inset-top, 0px) calc(32px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header.top {
  margin: 0 -16px; padding: 22px 20px 26px;
  background: var(--dusk); color: #FBF3EA;
  display: flex; flex-direction: column; gap: 6px;
}
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: #F2B66E; font-weight: 700; }
h1 { font-family: var(--font-display); font-size: clamp(22px, 6.6vw, 32px); line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { margin: 0; color: #EBDCCD; font-size: 14px; }
.lang {
  font: inherit; font-size: 13px; color: #FBF3EA; background: transparent;
  border: 1px solid #8C6E5D; border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.lang:focus-visible, button:focus-visible, textarea:focus-visible, .opt input:focus-visible + span { outline: 3px solid var(--amber); outline-offset: 2px; }

.privacy {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13px; color: var(--ink-soft); margin: 0;
}
.privacy svg { flex: none; margin-top: 3px; }

/* progress */
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0; }
.steps li button {
  width: 100%; height: 30px; border: 0; border-radius: 8px; cursor: pointer;
  background: var(--line); color: var(--ink-soft); font: inherit; font-size: 12px; font-weight: 700;
}
.steps li button.done { background: var(--amber-soft); color: var(--ink); }
.steps li button[aria-current="step"] { background: var(--amber); color: #2B1D17; }

.card {
  background: var(--surface); border-radius: var(--radius); padding: 22px 20px 20px;
  box-shadow: 0 6px 24px rgba(59, 42, 34, .10);
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.stage { display: flex; align-items: baseline; gap: 10px; }
.stage .num { font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--amber); font-weight: 700; }
.stage .name { font-size: 14px; font-weight: 700; color: var(--sage); letter-spacing: .06em; }
.card h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.45; margin: 0; font-weight: 700; text-wrap: balance; }
.hint { margin: 0; color: var(--ink-soft); font-size: 14px; }
textarea {
  width: 100%; min-height: 150px; resize: vertical;
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.saved { font-size: 12px; color: var(--ink-soft); min-height: 18px; margin: -6px 0 0; }

.verse {
  margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--amber-soft);
  font-family: var(--font-display); font-size: 16px; line-height: 1.7;
}
.verse cite { display: block; font-family: var(--font-body); font-style: normal; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

/* status options */
.opts { display: grid; gap: 10px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; }
.opt span {
  display: block; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer;
}
.opts.row { grid-template-columns: repeat(3, 1fr); }
.opts.row .opt span { text-align: center; padding: 10px 6px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.flabel { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
textarea.short { min-height: 88px; }
.opt input:checked + span { border-color: var(--amber); background: var(--amber-soft); font-weight: 700; }

.nav { display: flex; gap: 10px; }
.btn {
  flex: 1; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
  border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--dusk); color: #FBF3EA; border-color: var(--dusk); }
:root[data-theme="dark"] .btn.primary { background: var(--amber); color: #2B1D17; border-color: var(--amber); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--amber); color: #2B1D17; border-color: var(--amber); } }
.btn[disabled] { opacity: .4; cursor: default; }

/* summary */
.sum-item { display: flex; flex-direction: column; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.sum-item:last-of-type { border-bottom: 0; }
.sum-q { font-size: 13px; font-weight: 700; color: var(--sage); }
.sum-a { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.sum-a.empty { color: var(--ink-soft); font-style: italic; }
.core { font-family: var(--font-display); font-size: 19px; line-height: 1.7; margin: 0; }
.blessing { margin: 0; color: var(--ink-soft); font-size: 14px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn.wide { grid-column: 1 / -1; }
.toast { font-size: 13px; color: var(--sage); min-height: 20px; margin: 0; text-align: center; }
.fallback { display: flex; flex-direction: column; gap: 6px; }
.fallback textarea { min-height: 180px; font-size: 13px; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 1px dashed var(--line); }
.foot { text-align: center; font-size: 12px; color: var(--ink-soft); margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --ink-soft: #444; --line: #ccc; --amber-soft: #f6efe2; }
  body { background: #fff; padding: 0; }
  header.top, .privacy, .steps, .nav, .actions, .toast, .fallback, .confirm, .foot, .no-print { display: none !important; }
  .card { box-shadow: none; padding: 0; }
  .print-head { display: block !important; }
}
.print-head { display: none; font-family: var(--font-display); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <span class="eyebrow" data-i18n="eyebrow">MY TIME JOURNAL</span>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">English</button>
    </div>
    <h1 data-i18n="title">你的時間，正在說什麼故事？</h1>
    <p class="sub" data-i18n="subtitle">從效率、選擇，到有智慧地生活</p>
  </header>

  <p class="privacy">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/></svg>
    <span data-i18n="privacy">你的答案只存在這支手機的瀏覽器裡，不會上傳，講者也看不到。結束前記得複製或存檔。</span>
  </p>

  <ol class="steps" id="steps" aria-label="進度"></ol>

  <main id="view"></main>

  <p class="foot" data-i18n="foot">可以跳過任何一題，也可以隨時回來修改。</p>
</div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "time-journal-v2";

  var T = {
    zh: {
      eyebrow: "MY TIME JOURNAL",
      title: "你的時間，正在說什麼故事？",
      subtitle: "從效率、選擇，到有智慧地生活",
      privacy: "你的答案只存在這支手機的瀏覽器裡，不會上傳，講者也看不到。結束前記得複製或存檔。",
      foot: "可以跳過任何一題，也可以隨時回來修改。",
      langBtn: "English",
      stepsLabel: "進度",
      stepShort: ["狀態", "01", "02", "03", "04", "總結"],
      prev: "上一題", next: "下一題", toSummary: "看我的總結", start: "開始",
      saved: "已自動儲存在這支手機",
      placeholder: "一兩句就好，想到什麼寫什麼…",
      status: {
        name: "開始之前",
        q: "用一句話形容你最近的時間狀態，你會選哪一個？",
        hint: "這不是測驗，沒有標準答案。分享結束時，再回頭看看這個選擇。",
        options: ["我的時間好像不夠用", "有點忙，但還可以", "有時間，但不知道該做什麼", "我很滿意目前的生活節奏"]
      },
      qs: [
        { name: "感受時間", q: "回想最近一次，讓你覺得時間花得很值得／浪費的事情是什麼？為什麼？",
          hint: "值得或浪費都可以，選一個寫。「值得」不一定要有成果；「浪費」也不用責備自己。" },
        { name: "辨識選擇", q: "你現在最花時間的幾件事情，是你主動選擇的嗎？",
          hint: "試著分辨：哪一部分是你選的？哪一部分是被推著走的？" },
        { name: "反思價值", q: "你希望自己成為一個怎麼樣的人？花更多時間在什麼事情上？",
          hint: "例如：「我希望成為願意陪伴人的人，所以想多花時間在……」",
          verse: "神就照著自己的形像造人，乃是照著他的形像造男造女。", verseRef: "創世記 1:27（和合本）" },
        { name: "今日狀態檢查", q: "我的今日狀態檢查",
          hint: "現在先寫一次。之後每晚睡前花 1 分鐘回來寫，一週後回頭看看。",
          verse: "不可少的只有一件；馬利亞已經選擇那上好的福分，是不能奪去的。", verseRef: "路加福音 10:42（和合本）" }
      ],
      daily: {
        energyQ: "今天我的精力如何？", energy: ["充足", "普通", "疲憊"],
        worthQ: "今天哪一件事讓我覺得時間花得值得？", worthPh: "例如：陪朋友吃晚餐、完成重要作業",
        tweakQ: "明天我想嘗試的一個小調整", tweakPh: "例如：睡前不滑手機、留一段空白時間",
        copy: "複製我的紀錄", energyLabel: "精力", worthLabel: "值得的事", tweakLabel: "明天的小調整"
      },
      sumName: "我的反思總結",
      sumTitle: "我的時間，正在說什麼故事？",
      statusLabel: "我最近的時間狀態",
      empty: "（這題先留白）",
      core: "時間管理的終點，不是把每一分鐘都用得有效率，而是學習辨識什麼值得我們投入時間，並在有限的生命中，活出有意義的選擇。",
      blessing: "願你不只是擁有一個更有效率的行程表，也能在每一天的選擇中，漸漸看見自己所珍惜的事物。",
      copy: "複製全部文字", txt: "下載 TXT", pdf: "存成 PDF（列印）", clear: "清除我的答案", back: "回去修改",
      copied: "已複製，可以貼到備忘錄或傳給自己。",
      copyFail: "這個瀏覽器不允許自動複製，請長按下方文字全選後複製。",
      txtDone: "已下載文字檔。",
      txtFail: "這個瀏覽器無法下載，請改用「複製全部文字」。",
      pdfHint: "在列印視窗選「另存為 PDF」。",
      fallbackLabel: "全部文字（可長按全選）",
      confirmQ: "確定要清除這支手機上的所有答案嗎？清除後無法復原。",
      confirmYes: "確定清除", confirmNo: "取消", cleared: "已清除。",
      fileTitle: "時間反思筆記", dateLabel: "日期"
    },
    en: {
      eyebrow: "MY TIME JOURNAL",
      title: "What Story Is Your Time Telling?",
      subtitle: "From efficiency and choices to living wisely",
      privacy: "Your answers stay in this phone's browser. Nothing is uploaded, and the speaker can't see them. Copy or save them before you leave.",
      foot: "Skip any question, and come back to edit anytime.",
      langBtn: "中文",
      stepsLabel: "Progress",
      stepShort: ["Now", "01", "02", "03", "04", "Recap"],
      prev: "Back", next: "Next", toSummary: "See my recap", start: "Start",
      saved: "Saved on this phone",
      placeholder: "A sentence or two is enough…",
      status: {
        name: "Before we start",
        q: "Which one best describes your time lately?",
        hint: "This isn't a test and there's no right answer. Look back at it at the end.",
        options: ["I never seem to have enough time", "Busy, but it's okay", "I have time, but don't know what to do with it", "I'm happy with my current rhythm"]
      },
      qs: [
        { name: "Notice", q: "Think of a recent time that felt truly well spent, or wasted. What was it, and why?",
          hint: "Pick either one. \"Well spent\" doesn't need a result, and \"wasted\" isn't a reason to blame yourself." },
        { name: "Discern", q: "The few things taking most of your time right now: did you actively choose them?",
          hint: "Try to tell apart: which part did you choose, and which part are you being pushed along by?" },
        { name: "Reflect", q: "What kind of person do you hope to become? What would you spend more time on?",
          hint: "For example: \"I want to be someone who's there for people, so I'd spend more time on…\"",
          verse: "God created man in his own image. In God's image he created him; male and female he created them.", verseRef: "Genesis 1:27 (WEB)" },
        { name: "Daily check", q: "My daily check-in",
          hint: "Fill it in once now. Then take one minute before bed each night, and look back after a week.",
          verse: "One thing is needed. Mary has chosen the good part, which will not be taken away from her.", verseRef: "Luke 10:42 (WEB)" }
      ],
      daily: {
        energyQ: "How is my energy today?", energy: ["Full", "Okay", "Tired"],
        worthQ: "What made my time feel well spent today?", worthPh: "e.g. dinner with a friend, finishing an important assignment",
        tweakQ: "One small change I want to try tomorrow", tweakPh: "e.g. no phone before bed, keep a block of free time",
        copy: "Copy my check-in", energyLabel: "Energy", worthLabel: "Well spent", tweakLabel: "Tomorrow's change"
      },
      sumName: "My recap",
      sumTitle: "What story is my time telling?",
      statusLabel: "My time lately",
      empty: "(left blank for now)",
      core: "The goal of time management isn't to make every minute efficient. It's learning to discern what is worth our time, and to make meaningful choices within a limited life.",
      blessing: "May you gain more than an efficient schedule: may your everyday choices slowly show you what you truly treasure.",
      copy: "Copy all text", txt: "Download TXT", pdf: "Save as PDF (print)", clear: "Clear my answers", back: "Go back and edit",
      copied: "Copied. Paste it into your notes or send it to yourself.",
      copyFail: "This browser blocked copying. Long-press the text below, select all, and copy.",
      txtDone: "Text file downloaded.",
      txtFail: "This browser can't download files. Use \"Copy all text\" instead.",
      pdfHint: "In the print dialog, choose \"Save as PDF\".",
      fallbackLabel: "All text (long-press to select)",
      confirmQ: "Clear all answers on this phone? This can't be undone.",
      confirmYes: "Clear", confirmNo: "Cancel", cleared: "Cleared.",
      fileTitle: "Time Journal", dateLabel: "Date"
    }
  };

  // ---------- state ----------
  var state = { lang: "zh", step: 0, status: "", answers: ["", "", "", ""], daily: { energy: "", worth: "", tweak: "" } };
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.answers)) { state = Object.assign(state, s); state.daily = Object.assign({ energy: "", worth: "", tweak: "" }, s.daily || {}); }
      } else if (navigator.language && !/^zh/i.test(navigator.language)) {
        state.lang = "en";
      }
    } catch (e) { /* storage unavailable: keep defaults */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  var view = document.getElementById("view");
  var stepsEl = document.getElementById("steps");
  var langBtn = document.getElementById("langBtn");
  var LAST = 5;

  function t() { return T[state.lang]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function isDone(i) {
    if (i === 0) return !!state.status;
    if (i >= 1 && i <= 3) return state.answers[i - 1].trim().length > 0;
    if (i === 4) return !!(state.daily.energy || state.daily.worth.trim() || state.daily.tweak.trim());
    return false;
  }

  function renderChrome() {
    var L = t();
    document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = L[el.getAttribute("data-i18n")]; });
    langBtn.textContent = L.langBtn;
    stepsEl.setAttribute("aria-label", L.stepsLabel);
    stepsEl.innerHTML = L.stepShort.map(function (lbl, i) {
      var cls = isDone(i) ? "done" : "";
      var cur = i === state.step ? ' aria-current="step"' : "";
      return '<li><button type="button" class="' + cls + '" data-go="' + i + '"' + cur + '>' + esc(lbl) + "</button></li>";
    }).join("");
  }

  function navHtml() {
    var L = t();
    var prev = '<button type="button" class="btn" id="prevBtn"' + (state.step === 0 ? " disabled" : "") + ">" + esc(L.prev) + "</button>";
    var nextLabel = state.step === 4 ? L.toSummary : L.next;
    return '<div class="nav">' + prev + '<button type="button" class="btn primary" id="nextBtn">' + esc(nextLabel) + "</button></div>";
  }

  function renderStatus() {
    var L = t(), S = L.status;
    var opts = S.options.map(function (o, i) {
      var checked = state.status === String(i) ? " checked" : "";
      return '<label class="opt"><input type="radio" name="status" id="status-' + i + '" value="' + i + '"' + checked + "><span>" + esc(o) + "</span></label>";
    }).join("");
    view.innerHTML =
      '<section class="card">' +
        '<div class="stage"><span class="name">' + esc(S.name) + "</span></div>" +
        "<h2>" + esc(S.q) + "</h2>" +
        '<p class="hint">' + esc(S.hint) + "</p>" +
        '<div class="opts" role="radiogroup">' + opts + "</div>" +
        navHtml() +
      "</section>";
    view.querySelectorAll('input[name="status"]').forEach(function (r) {
      r.addEventListener("change", function () { state.status = r.value; save(); renderChrome(); });
    });
  }

  function renderQuestion(n) {
    var L = t(), Q = L.qs[n];
    var verse = Q.verse ? '<blockquote class="verse">' + esc(Q.verse) + "<cite>" + esc(Q.verseRef) + "</cite></blockquote>" : "";
    view.innerHTML =
      '<section class="card">' +
        '<div class="stage"><span class="num">0' + (n + 1) + '</span><span class="name">' + esc(Q.name) + "</span></div>" +
        '<h2 id="qTitle">' + esc(Q.q) + "</h2>" +
        '<p class="hint">' + esc(Q.hint) + "</p>" +
        verse +
        '<textarea id="answer-' + n + '" aria-labelledby="qTitle" placeholder="' + esc(L.placeholder) + '">' + esc(state.answers[n]) + "</textarea>" +
        '<p class="saved" id="savedNote" aria-live="polite"></p>' +
        navHtml() +
      "</section>";
    var ta = document.getElementById("answer-" + n);
    var note = document.getElementById("savedNote");
    var timer;
    ta.addEventListener("input", function () {
      state.answers[n] = ta.value;
      clearTimeout(timer);
      timer = setTimeout(function () { if (save()) note.textContent = L.saved; renderChrome(); }, 400);
    });
  }

  function copyWithFallback(text, toast, okMsg, failMsg, fbId) {
    function fallback() {
      var fb = document.getElementById(fbId), ta = fb.querySelector("textarea");
      ta.value = text; fb.hidden = false; ta.focus(); ta.select();
    }
    try {
      navigator.clipboard.writeText(text).then(function () { toast.textContent = okMsg; }, function () { toast.textContent = failMsg; fallback(); });
    } catch (e) { toast.textContent = failMsg; fallback(); }
  }

  function dailyLines() {
    var L = t(), D = L.daily, d = state.daily;
    return [
      D.energyLabel + "：" + (d.energy === "" ? L.empty : D.energy[Number(d.energy)]),
      D.worthLabel + "：" + (d.worth.trim() || L.empty),
      D.tweakLabel + "：" + (d.tweak.trim() || L.empty)
    ];
  }

  function renderDaily() {
    var L = t(), Q = L.qs[3], D = L.daily;
    var opts = D.energy.map(function (o, i) {
      var checked = state.daily.energy === String(i) ? " checked" : "";
      return '<label class="opt"><input type="radio" name="energy" id="energy-' + i + '" value="' + i + '"' + checked + "><span>" + esc(o) + "</span></label>";
    }).join("");
    view.innerHTML =
      '<section class="card">' +
        '<div class="stage"><span class="num">04</span><span class="name">' + esc(Q.name) + "</span></div>" +
        "<h2>" + esc(Q.q) + "</h2>" +
        '<p class="hint">' + esc(Q.hint) + "</p>" +
        '<div class="field"><span class="flabel" id="energyLbl">' + esc(D.energyQ) + '</span><div class="opts row" role="radiogroup" aria-labelledby="energyLbl">' + opts + "</div></div>" +
        '<div class="field"><label class="flabel" for="daily-worth">' + esc(D.worthQ) + '</label><textarea class="short" id="daily-worth" placeholder="' + esc(D.worthPh) + '">' + esc(state.daily.worth) + "</textarea></div>" +
        '<div class="field"><label class="flabel" for="daily-tweak">' + esc(D.tweakQ) + '</label><textarea class="short" id="daily-tweak" placeholder="' + esc(D.tweakPh) + '">' + esc(state.daily.tweak) + "</textarea></div>" +
        '<button type="button" class="btn primary" id="dailyCopy">' + esc(D.copy) + "</button>" +
        '<p class="toast" id="dailyToast" aria-live="polite"></p>' +
        '<div class="fallback" id="dailyFallback" hidden><textarea readonly aria-label="' + esc(L.fallbackLabel) + '"></textarea></div>' +
        '<blockquote class="verse">' + esc(Q.verse) + "<cite>" + esc(Q.verseRef) + "</cite></blockquote>" +
        navHtml() +
      "</section>";
    view.querySelectorAll('input[name="energy"]').forEach(function (r) {
      r.addEventListener("change", function () { state.daily.energy = r.value; save(); renderChrome(); });
    });
    var timer;
    [["daily-worth", "worth"], ["daily-tweak", "tweak"]].forEach(function (pair) {
      var ta = document.getElementById(pair[0]);
      ta.addEventListener("input", function () {
        state.daily[pair[1]] = ta.value;
        clearTimeout(timer);
        timer = setTimeout(function () { save(); renderChrome(); }, 400);
      });
    });
    document.getElementById("dailyCopy").addEventListener("click", function () {
      var text = Q.q + "｜" + todayStr() + "\n" + dailyLines().join("\n");
      copyWithFallback(text, document.getElementById("dailyToast"), L.copied, L.copyFail, "dailyFallback");
    });
  }

  function statusText() {
    var L = t();
    return state.status === "" ? L.empty : L.status.options[Number(state.status)];
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function plainText() {
    var L = t();
    var lines = [L.fileTitle + "｜" + L.title, L.subtitle, L.dateLabel + "：" + todayStr(), "", "【" + L.statusLabel + "】", statusText(), ""];
    L.qs.forEach(function (Q, i) {
      lines.push("【0" + (i + 1) + " " + Q.name + "】" + (i === 3 ? "" : Q.q));
      if (i === 3) lines = lines.concat(dailyLines());
      else lines.push(state.answers[i].trim() || L.empty);
      lines.push("");
    });
    lines.push("—");
    lines.push(L.core);
    lines.push("");
    lines.push(L.blessing);
    return lines.join("\n");
  }

  function renderSummary() {
    var L = t();
    var items = '<div class="sum-item"><span class="sum-q">' + esc(L.statusLabel) + '</span><p class="sum-a' + (state.status === "" ? " empty" : "") + '">' + esc(statusText()) + "</p></div>";
    L.qs.forEach(function (Q, i) {
      if (i === 3) {
        items += '<div class="sum-item"><span class="sum-q">04 ' + esc(Q.name) + '</span><p class="sum-a">' + esc(dailyLines().join("\n")) + "</p></div>";
        return;
      }
      var a = state.answers[i].trim();
      items += '<div class="sum-item"><span class="sum-q">0' + (i + 1) + " " + esc(Q.name) + "｜" + esc(Q.q) + '</span><p class="sum-a' + (a ? "" : " empty") + '">' + esc(a || L.empty) + "</p></div>";
    });
    view.innerHTML =
      '<section class="card">' +
        '<div class="print-head">' + esc(L.fileTitle) + "｜" + esc(L.title) + " · " + todayStr() + "</div>" +
        '<div class="stage"><span class="name">' + esc(L.sumName) + "</span></div>" +
        "<h2>" + esc(L.sumTitle) + "</h2>" +
        items +
        '<blockquote class="verse"><p class="core">' + esc(L.core) + "</p></blockquote>" +
        '<p class="blessing">' + esc(L.blessing) + "</p>" +
        '<div class="actions">' +
          '<button type="button" class="btn primary wide" id="copyBtn">' + esc(L.copy) + "</button>" +
          '<button type="button" class="btn" id="txtBtn">' + esc(L.txt) + "</button>" +
          '<button type="button" class="btn" id="pdfBtn">' + esc(L.pdf) + "</button>" +
          '<button type="button" class="btn" id="backBtn">' + esc(L.back) + "</button>" +
          '<button type="button" class="btn" id="clearBtn">' + esc(L.clear) + "</button>" +
        "</div>" +
        '<p class="toast" id="toast" aria-live="polite"></p>' +
        '<div class="fallback" id="fallback" hidden><label for="allText" class="hint">' + esc(L.fallbackLabel) + '</label><textarea id="allText" readonly></textarea></div>' +
        '<div class="confirm" id="confirmBox" hidden><p class="hint">' + esc(L.confirmQ) + '</p><div class="nav"><button type="button" class="btn" id="noBtn">' + esc(L.confirmNo) + '</button><button type="button" class="btn primary" id="yesBtn">' + esc(L.confirmYes) + "</button></div></div>" +
      "</section>";

    var toast = document.getElementById("toast");
    function showFallback() {
      var fb = document.getElementById("fallback"), ta = document.getElementById("allText");
      ta.value = plainText(); fb.hidden = false; ta.focus(); ta.select();
    }
    document.getElementById("copyBtn").addEventListener("click", function () {
      var text = plainText();
      try {
        navigator.clipboard.writeText(text).then(function () { toast.textContent = L.copied; }, function () { toast.textContent = L.copyFail; showFallback(); });
      } catch (e) { toast.textContent = L.copyFail; showFallback(); }
    });
    document.getElementById("txtBtn").addEventListener("click", function () {
      try {
        var blob = new Blob([plainText()], { type: "text/plain;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = L.fileTitle + "_" + todayStr() + ".txt";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        toast.textContent = L.txtDone;
      } catch (e) { toast.textContent = L.txtFail; showFallback(); }
    });
    document.getElementById("pdfBtn").addEventListener("click", function () {
      toast.textContent = L.pdfHint;
      try { window.print(); } catch (e) { /* ignore */ }
    });
    document.getElementById("backBtn").addEventListener("click", function () { go(1); });
    document.getElementById("clearBtn").addEventListener("click", function () { document.getElementById("confirmBox").hidden = false; });
    document.getElementById("noBtn").addEventListener("click", function () { document.getElementById("confirmBox").hidden = true; });
    document.getElementById("yesBtn").addEventListener("click", function () {
      state.status = ""; state.answers = ["", "", "", ""]; state.daily = { energy: "", worth: "", tweak: "" }; state.step = 0;
      try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
      render(); window.scrollTo(0, 0);
    });
  }

  function render() {
    renderChrome();
    if (state.step === 0) renderStatus();
    else if (state.step <= 3) renderQuestion(state.step - 1);
    else if (state.step === 4) renderDaily();
    else renderSummary();
    var prev = document.getElementById("prevBtn"), next = document.getElementById("nextBtn");
    if (prev) prev.addEventListener("click", function () { go(state.step - 1); });
    if (next) next.addEventListener("click", function () { go(state.step + 1); });
  }

  function go(i) {
    state.step = Math.max(0, Math.min(LAST, i));
    save(); render();
    var top = stepsEl.getBoundingClientRect().top + window.scrollY - 12;
    if (window.scrollY > top) window.scrollTo(0, top);
  }

  stepsEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (b) go(Number(b.getAttribute("data-go")));
  });
  langBtn.addEventListener("click", function () { state.lang = state.lang === "zh" ? "en" : "zh"; save(); render(); });

  load();
  render();
})();
</script>
</body>
</html>
